<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
"use strict";

// ----------------------------------------------------------------
// API : couche fetch avec cookie session + CSRF
// ----------------------------------------------------------------
const API = {
  base: "/api/v1/",
  csrf: "",
  async initCSRF() {
    try { await fetch(this.base + "csrf/", { credentials: "same-origin" }); } catch (e) {}
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    this.csrf = m ? m[1] : "";
  },
  async requete(chemin, options = {}) {
    const config = { credentials: "same-origin", headers: {} };
    if (options.body && !(options.body instanceof FormData)) {
      config.headers["Content-Type"] = "application/json";
      config.body = JSON.stringify(options.body);
    } else if (options.body instanceof FormData) {
      config.body = options.body;
    }
    if (options.method) config.method = options.method;
    if (this.csrf) config.headers["X-CSRFToken"] = this.csrf;
    const reponse = await fetch(this.base + chemin, config);
    if (reponse.status === 403) {
      await this.initCSRF();
      if (this.csrf) config.headers["X-CSRFToken"] = this.csrf;
      const reponse2 = await fetch(this.base + chemin, config);
      if (!reponse2.ok) throw Object.assign(new Error("Requête refusée"), { reponse: reponse2 });
      return reponse2.status === 204 ? null : reponse2.json();
    }
    if (!reponse.ok) {
      let detail = "Erreur inattendue.";
      try { const j = await reponse.json(); detail = JSON.stringify(j); } catch (e) {}
      throw Object.assign(new Error(detail), { reponse });
    }
    return reponse.status === 204 ? null : reponse.json();
  },
  get: (c) => this.requete(c),
  post: (c, b) => this.requete(c, { method: "POST", body: b }),
  patch: (c, b) => this.requete(c, { method: "PATCH", body: b }),
  delete: (c) => this.requete(c, { method: "DELETE" }),
};

// ----------------------------------------------------------------
// Utilitaires
// ----------------------------------------------------------------
function fmtMontant(n) {
  if (n === null || n === undefined) return "—";
  return Number(n).toLocaleString("fr-FR") + " FCFA";
}
function fmtDate(d) {
  if (!d) return "—";
  const [a, m, j] = String(d).slice(0, 10).split("-");
  return j + "/" + m + "/" + a;
}
function badgeStatut(statut) {
  const map = {
    "incomplet": "danger", "complet": "warning", "valide": "success",
    "manquant": "danger", "soumis": "info", "rejete": "danger",
    "a_venir": "secondary", "payee": "success", "partielle": "warning", "en_retard": "danger",
    "en_attente": "warning", "envoye": "success", "echec": "danger",
  };
  const labels = {
    "incomplet": "Incomplet", "complet": "Complet", "valide": "Validé",
    "manquant": "Manquant", "soumis": "Soumis", "rejete": "Rejeté",
    "a_venir": "À venir", "payee": "Payée", "partielle": "Partielle", "en_retard": "En retard",
    "en_attente": "En attente", "envoye": "Envoyé", "echec": "Échec",
  };
  const couleur = map[statut] || "secondary";
  return `<span class="badge bg-${couleur} badge-statut">${labels[statut] || statut}</span>`;
}
function afficherToast(message, type = "success") {
  const couleurs = { success: "text-bg-success", danger: "text-bg-danger", warning: "text-bg-warning", info: "text-bg-info" };
  const el = document.createElement("div");
  el.className = "toast align-items-center " + (couleurs[type] || "text-bg-info");
  el.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  document.getElementById("toasts").appendChild(el);
  const toast = new bootstrap.Toast(el, { delay: 4000 });
  toast.show();
  el.addEventListener("hidden.bs.toast", () => el.remove());
}
function chargerEtatVide(message, bouton = null) {
  return `<div class="text-center text-secondary py-5">
    <div style="font-size:3rem;">🗂️</div>
    <p class="mt-2">${message}</p>
    ${bouton ? `<button class="btn btn-vert" onclick="${bouton}">+ Ajouter</button>` : ""}
  </div>`;
}

// ----------------------------------------------------------------
// Session
// ----------------------------------------------------------------
let profil = null;

async function verifierSession() {
  try {
    profil = await API.get("moi/");
    return true;
  } catch (e) {
    profil = null;
    return false;
  }
}

function rendreNavigation() {
  const lie = document.getElementById("lienAgence");
  if (profil) {
    lie.style.display = "";
    document.getElementById("nomAgence").textContent =
      profil.agence ? profil.agence.nom : (profil.is_staff ? "Vue globale (admin)" : profil.nom);
    if (profil.is_staff) { lie.style.display = "none"; }
  } else {
    lie.style.display = "none";
  }
}

// ----------------------------------------------------------------
// Routeur (hash)
// ----------------------------------------------------------------
const routeur = {
  routes: {},
  ajouter: function (motif, fn) { this.routes[motif] = fn; },
  naviguer: function () {
    const hash = location.hash.replace(/^#/, "") || "/tableau-de-bord";
    for (const motif in this.routes) {
      const m = hash.match(motif);
      if (m) { this.routes[motif](m); return; }
    }
    this.routes["/tableau-de-bord"]();
  },
};

function aller(route) { location.hash = "#" + route; }

document.querySelectorAll(".page-lien").forEach((el) => {
  el.addEventListener("click", () => aller("/" + el.dataset.page));
});

// ----------------------------------------------------------------
// Composants de formulaire
// ----------------------------------------------------------------
function champ(ids, type, label, options = {}) {
  let controle;
  if (type === "select") {
    const opts = options.choix.map((c) => `<option value="${c[0]}" ${c[0] === options.valeur ? "selected" : ""}>${c[1]}</option>`).join("");
    controle = `<select class="form-select" id="${ids}">${opts}</select>`;
  } else if (type === "textarea") {
    controle = `<textarea class="form-control" id="${ids}" rows="3">${options.valeur || ""}</textarea>`;
  } else {
    controle = `<input type="${type}" class="form-control" id="${ids}" value="${options.valeur || ""}" ${options.requis ? "required" : ""} ${options.min ? `min="${options.min}"` : ""} ${options.step ? `step="${options.step}"` : ""}>`;
  }
  return `<div class="mb-3"><label class="form-label" for="${ids}">${label}${options.requis ? " *" : ""}</label>${controle}</div>`;
}
function ouvrirModal(titre, html) {
  document.getElementById("titreModal").textContent = titre;
  document.getElementById("corpsModal").innerHTML = html;
  bootstrap.Modal.getOrCreateInstance(document.getElementById("modalFormulaire")).show();
}
function fermerModal() {
  bootstrap.Modal.getInstance(document.getElementById("modalFormulaire"))?.hide();
}

// Pages

// --- Connexion ---
routeur.ajouter(/^\/connexion$/, function () {
  document.getElementById("contenu").innerHTML = `
  <div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h4 class="text-center mb-3">🕋 Connexion</h4>
          <form id="formConnexion">
            <div class="mb-3"><label class="form-label">Utilisateur</label>
              <input type="text" class="form-control" id="loginNom" required autofocus></div>
            <div class="mb-3"><label class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="loginMdp" required></div>
            <button class="btn btn-vert w-100">Se connecter</button>
          </form>
          <div class="text-danger mt-2 small" id="loginErreur"></div>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById("formConnexion").addEventListener("submit", async (e) => {
    e.preventDefault();
    const corps = new URLSearchParams({
      username: document.getElementById("loginNom").value,
      password: document.getElementById("loginMdp").value,
    });
    try {
      const rep = await fetch(API.base + "connexion/", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/x-www-form-urlencoded", "X-CSRFToken": API.csrf },
        body: corps,
      });
      if (!rep.ok) { document.getElementById("loginErreur").textContent = "Identifiants invalides."; return; }
      await API.initCSRF();
      aller("/tableau-de-bord");
    } catch (err) {
      document.getElementById("loginErreur").textContent = "Erreur réseau.";
    }
  });
});

// --- Tableau de bord ---

  contenu.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>`;
  try {
    const d = await API.get("dashboard/");
    const a = d.alertes;
    contenu.innerHTML = `
      <h4 class="mb-3">Tableau de bord</h4>
      <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
          <div class="text-secondary small">Groupes</div><div class="fs-3 fw-bold">${d.compteurs.groupes}</div>
          <div class="small text-secondary">${d.compteurs.places_restantes} places restantes</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
          <div class="text-secondary small">Pèlerins</div><div class="fs-3 fw-bold">${d.compteurs.pelerins}</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
          <div class="text-secondary small">Collecté</div><div class="fs-5 fw-bold text-success">${fmtMontant(d.finance.total_paye)}</div>
          <div class="small text-secondary">reste : ${fmtMontant(d.finance.total_reste_du)}</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
          <div class="text-secondary small">Rappels en attente</div><div class="fs-3 fw-bold">${a.rappels_en_attente}</div></div></div></div>
      </div>
      <h5 class="mt-4 mb-2">⚠️ À traiter en priorité</h5>
      <div class="row g-3">
        <div class="col-md-6 col-lg-3"><div class="card carte-alerte rouge p-3">
          <div class="fs-4 fw-bold">${a.pelerins_incomplets}</div>
          <div>Dossiers incomplets</div><a class="small page-lien" onclick="aller('/pelerins?statut=incomplet')">Voir →</a></div></div>
        <div class="col-md-6 col-lg-3"><div class="card carte-alerte rouge p-3">
          <div class="fs-4 fw-bold">${a.paiements_en_retard}</div>
          <div>Paiements en retard</div><a class="small page-lien" onclick="aller('/paiements')">Voir →</a></div></div>
        <div class="col-md-6 col-lg-3"><div class="card carte-alerte orange p-3">
          <div class="fs-4 fw-bold">${a.documents_expirants}</div>
          <div>Documents qui expirent (< 30 j)</div><a class="small page-lien" onclick="aller('/pelerins')">Voir →</a></div></div>
      </div>
      <div class="row mt-4">
        <div class="col-lg-6">
          <h6>Derniers pèlerins inscrits</h6>
          ${d.derniers_pelerins.length === 0 ? chargerEtatVide("Aucun pèlerin pour l'instant.", "aller('/pelerins/nouveau')") : `
          <ul class="list-group">${d.derniers_pelerins.map((p) => `
            <li class="list-group-item d-flex justify-content-between align-items-center page-lien" onclick="aller('/pelerins/${p.id}')">
              <span>${p.prenom} ${p.nom}<br><small class="text-secondary">${p.groupe_nom}</small></span>
              ${badgeStatut(p.statut_dossier)}</li>`).join("")}</ul>`}
        </div>
        <div class="col-lg-6">
          <h6>Derniers paiements</h6>
          ${d.derniers_paiements.length === 0 ? chargerEtatVide("Aucun paiement enregistré.") : `
          <ul class="list-group">${d.derniers_paiements.map((p) => `
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span>${p.mode_label} · <strong>${fmtMontant(p.montant_paye)}</strong><br>
              <small class="text-secondary">${p.enregistre_par_nom || ""} — ${fmtDate(p.date_paiement)}</small></span>
            </li>`).join("")}</ul>`}
        </div>
      </div>`;
  } catch (err) { contenu.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
});

// --- Groupes ---
routeur.ajouter(/^\/groupes$/, async function () {
  const contenu = document.getElementById("contenu");
  contenu.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>`;
  try {
    const groupes = await API.get("groupes/");
    contenu.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Groupes</h4>
        <button class="btn btn-vert" onclick="aller('/groupes/nouveau')">+ Nouveau groupe</button>
      </div>
      ${groupes.length === 0 ? chargerEtatVide("Aucun groupe. Créez votre premier départ.", "aller('/groupes/nouveau')") : `
      <div class="table-responsive"><table class="table table-hover bg-white shadow-sm rounded">
        <thead><tr><th>Nom</th><th>Type</th><th>Départ</th><th>Retour</th><th>Inscrits</th><th>Places</th><th></th></tr></thead>
        <tbody>${groupes.map((g) => `
          <tr class="page-lien" onclick="aller('/groupes/${g.id}')">
            <td class="fw-semibold">${g.nom}</td>
            <td>${g.type_voyage_label}</td>
            <td>${fmtDate(g.date_depart)}</td>
            <td>${fmtDate(g.date_retour)}</td>
            <td>${g.nb_pelerins_inscrits}</td>
            <td>${g.nb_places_max}</td>
            <td><span class="text-secondary">${g.places_disponibles} libres</span></td>
          </tr>`).join("")}</tbody></table></div>`}`;
  } catch (err) { contenu.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
});

// --- Formulaire groupe ---
routeur.ajouter(/^\/groupes\/nouveau$/, async function () {
  const contenu = document.getElementById("contenu");
  const estAdmin = profil && profil.agence === null;
  const agences = estAdmin ? await API.get("agences/") : [];
  const selectAgence = estAdmin
    ? champ("g_agence", "select", "Agence", { requis: true, choix: agences.map((a) => [a.id, a.nom]) })
    : "";
  contenu.innerHTML = `
    <h4 class="mb-3">Nouveau groupe</h4>
    <div class="card shadow-sm p-4 col-lg-8">
      <form id="formGroupe">
        ${selectAgence}
        ${champ("g_nom", "text", "Nom du groupe", { requis: true, valeur: "Hajj 2027" })}
        ${champ("g_type", "select", "Type de voyage", { requis: true, choix: [["hajj", "Hajj"], ["omra", "Omra"]] })}
        <div class="row">
          <div class="col-md-6">${champ("g_depart", "date", "Date de départ", { requis: true })}</div>
          <div class="col-md-6">${champ("g_retour", "date", "Date de retour", { requis: true })}</div>
        </div>
        ${champ("g_places", "number", "Nombre de places", { requis: true, min: "1" })}
        <div class="d-flex gap-2">
          <button class="btn btn-vert">Enregistrer</button>
          <button type="button" class="btn btn-outline-secondary" onclick="aller('/groupes')">Annuler</button>
        </div>
      </form>
    </div>`;
  document.getElementById("formGroupe").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const corps = {
        nom: document.getElementById("g_nom").value,
        type_voyage: document.getElementById("g_type").value,
        date_depart: document.getElementById("g_depart").value,
        date_retour: document.getElementById("g_retour").value,
        nb_places_max: Number(document.getElementById("g_places").value),
      };
      if (estAdmin) corps.agence = Number(document.getElementById("g_agence").value);
      await API.post("groupes/", corps);
      afficherToast("Groupe créé.");
      aller("/groupes");
    } catch (err) { afficherToast(err.message, "danger"); }
  });
});

// --- Détail groupe ---

  const contenu = document.getElementById("contenu");
  contenu.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>`;
  try {
    const g = await API.get("groupes/" + m[1] + "/");
    const pelerins = await API.get("groupes/" + m[1] + "/pelerins/");
    contenu.innerHTML = `
      <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item page-lien" onclick="aller('/groupes')">Groupes</li>
        <li class="breadcrumb-item active">${g.nom}</li></ol></nav>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">${g.nom} <span class="badge bg-secondary">${g.type_voyage_label}</span></h4>
        <button class="btn btn-vert" onclick="aller('/pelerins/nouveau?groupe=${g.id}')">+ Inscrire un pèlerin</button>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div class="text-secondary small">Départ</div><strong>${fmtDate(g.date_depart)}</strong></div></div></div>
        <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div class="text-secondary small">Retour</div><strong>${fmtDate(g.date_retour)}</strong></div></div></div>
        <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div class="text-secondary small">Inscrits</div><strong>${g.nb_pelerins_inscrits} / ${g.nb_places_max}</strong></div></div></div>
        <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div class="text-secondary small">Places libres</div><strong>${g.places_disponibles}</strong></div></div></div>
      </div>
      <h6 class="mt-3">Pèlerins du groupe</h6>
      ${pelerins.length === 0 ? chargerEtatVide("Aucun pèlerin inscrit dans ce groupe.", `aller('/pelerins/nouveau?groupe=${g.id}')`) : `
      <div class="table-responsive"><table class="table table-hover bg-white shadow-sm rounded">
        <thead><tr><th>Nom</th><th>Téléphone</th><th>Dossier</th><th></th></tr></thead>
        <tbody>${pelerins.map((p) => `
          <tr class="page-lien" onclick="aller('/pelerins/${p.id}')">
            <td>${p.prenom} ${p.nom}</td>
            <td>${p.telephone}</td>
            <td>${badgeStatut(p.statut_dossier)} ${p.nb_documents_manquants > 0 ? `<small class="text-danger">${p.nb_documents_manquants} pièce(s) manquante(s)</small>` : ""}</td>
            <td><span class="text-secondary">Ouvrir →</span></td>
          </tr>`).join("")}</tbody></table></div>`}`;
  } catch (err) { contenu.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
});

// --- Liste pèlerins ---
routeur.ajouter(/^\/pelerins$/, async function () {
  const contenu = document.getElementById("contenu");
  contenu.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>`;
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  try {
    const pelerins = await API.get("pelerins/?" + params.toString());
    contenu.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Pèlerins</h4>
        <button class="btn btn-vert" onclick="aller('/pelerins/nouveau')">+ Nouveau pèlerin</button>
      </div>
      <div class="input-group mb-3 col-lg-6">
        <input class="form-control" id="recherchePelerin" placeholder="Rechercher par nom, prénom ou téléphone…">
        <button class="btn btn-outline-secondary" onclick="rechercherPelerins()">Rechercher</button>
      </div>
      ${pelerins.length === 0 ? chargerEtatVide("Aucun pèlerin trouvé.", "aller('/pelerins/nouveau')") : `
      <div class="table-responsive"><table class="table table-hover bg-white shadow-sm rounded">
        <thead><tr><th>Nom</th><th>Groupe</th><th>Téléphone</th><th>Dossier</th><th></th></tr></thead>
        <tbody>${pelerins.map((p) => `
          <tr class="page-lien" onclick="aller('/pelerins/${p.id}')">
            <td>${p.prenom} ${p.nom}</td>
            <td>${p.groupe_nom}</td>
            <td>${p.telephone}</td>
            <td>${badgeStatut(p.statut_dossier)}</td>
            <td><span class="text-secondary">Ouvrir →</span></td>
          </tr>`).join("")}</tbody></table></div>`}`;
    document.getElementById("recherchePelerin")?.addEventListener("keyup", (e) => {
      if (e.key === "Enter") rechercherPelerins();
    });
  } catch (err) { contenu.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
});
window.rechercherPelerins = function () {
  const valeur = document.getElementById("recherchePelerin")?.value || "";
  const params = new URLSearchParams();
  if (valeur) params.set("search", valeur);
  aller("/pelerins?" + params.toString());
};

// --- Formulaire pèlerin ---
routeur.ajouter(/^\/pelerins\/nouveau$/, async function () {
  const contenu = document.getElementById("contenu");
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  const groupes = await API.get("groupes/");
  contenu.innerHTML = `
    <h4 class="mb-3">Inscrire un pèlerin</h4>
    <div class="card shadow-sm p-4 col-lg-8">
      <form id="formPelerin">
        ${champ("p_groupe", "select", "Groupe", { requis: true, choix: groupes.map((g) => [g.id, `${g.nom} (${g.places_disponibles} places)`]), valeur: params.get("groupe") || "" })}
        <div class="row">
          <div class="col-md-6">${champ("p_nom", "text", "Nom", { requis: true })}</div>
          <div class="col-md-6">${champ("p_prenom", "text", "Prénom", { requis: true })}</div>
        </div>
        <div class="row">
          <div class="col-md-6">${champ("p_telephone", "text", "Téléphone", { requis: true })}</div>
          <div class="col-md-6">${champ("p_email", "email", "Email (optionnel)")}</div>
        </div>
        <div class="row">
          <div class="col-md-6">${champ("p_naissance", "date", "Date de naissance")}</div>
          <div class="col-md-6">${champ("p_sexe", "select", "Sexe", { choix: [["M", "Homme"], ["F", "Femme"]] })}</div>
        </div>
        <div class="row">
          <div class="col-md-6">${champ("p_urg_nom", "text", "Contact urgence — nom")}</div>
          <div class="col-md-6">${champ("p_urg_tel", "text", "Contact urgence — téléphone")}</div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-vert">Enregistrer</button>
          <button type="button" class="btn btn-outline-secondary" onclick="history.length > 1 ? history.back() : aller('/pelerins')">Annuler</button>
        </div>
      </form>
    </div>`;
  document.getElementById("formPelerin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const corps = {
      groupe: Number(document.getElementById("p_groupe").value),
      nom: document.getElementById("p_nom").value,
      prenom: document.getElementById("p_prenom").value,
      telephone: document.getElementById("p_telephone").value,
      email: document.getElementById("p_email").value || null,
      date_naissance: document.getElementById("p_naissance").value || null,
      sexe: document.getElementById("p_sexe").value || null,
      contact_urgence_nom: document.getElementById("p_urg_nom").value || null,
      contact_urgence_telephone: document.getElementById("p_urg_tel").value || null,
    };
    try {
      const pelerin = await API.post("pelerins/", corps);
      afficherToast("Pèlerin inscrit.");
      aller("/pelerins/" + pelerin.id);
    } catch (err) { afficherToast(err.message, "danger"); }
  });
});

// --- Détail pèlerin ---
routeur.ajouter(/^\/pelerins\/(\d+)$/, async function (m) {
  const contenu = document.getElementById("contenu");
  contenu.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>`;
  try {
    const p = await API.get("pelerins/" + m[1] + "/");
    const plan = p.plan_paiement;
    contenu.innerHTML = `
      <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item page-lien" onclick="aller('/pelerins')">Pèlerins</li>
        <li class="breadcrumb-item active">${p.prenom} ${p.nom}</li></ol></nav>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">${p.prenom} ${p.nom} ${badgeStatut(p.statut_dossier)}</h4>
        <button class="btn btn-outline-secondary" onclick="modifierPelerin(${p.id})">✏️ Modifier</button>
      </div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card shadow-sm mb-3"><div class="card-body">
            <h6>Informations</h6>
            <table class="table table-sm mb-0">
              <tr><td class="text-secondary">Téléphone</td><td>${p.telephone}</td></tr>
              <tr><td class="text-secondary">Email</td><td>${p.email || "—"}</td></tr>
              <tr><td class="text-secondary">Naissance</td><td>${fmtDate(p.date_naissance)} ${p.sexe_label ? "· " + p.sexe_label : ""}</td></tr>
              <tr><td class="text-secondary">Contact urgence</td><td>${p.contact_urgence_nom || "—"} ${p.contact_urgence_telephone ? "· " + p.contact_urgence_telephone : ""}</td></tr>
            </table>
          </div></div>

          <div class="card shadow-sm"><div class="card-body">
            <h6>Documents du dossier</h6>
            ${p.documents.length === 0 ? chargerEtatVide("Aucun document enregistré.") : `
            <div class="table-responsive"><table class="table table-sm">
              <thead><tr><th>Document</th><th>Statut</th><th>Expiration</th><th></th></tr></thead>
              <tbody>${p.documents.map((d) => `
                <tr>
                  <td>${d.type_document_label}</td>
                  <td>${badgeStatut(d.statut)}</td>
                  <td>${fmtDate(d.date_expiration)}</td>
                  <td><button class="btn btn-sm btn-outline-secondary" onclick="modifierDocument(${d.id})">Modifier</button></td>
                </tr>`).join("")}</tbody></table></div>`}
          </div></div>
        </div>

        <div class="col-lg-6">
          <div class="card shadow-sm mb-3"><div class="card-body">
            <h6>Plan de paiement</h6>
            ${plan ? `
              <div class="row text-center g-2 mb-3">
                <div class="col-4"><div class="small text-secondary">Total</div><strong>${fmtMontant(plan.montant_total)}</strong></div>
                <div class="col-4"><div class="small text-secondary">Payé</div><strong class="text-success">${fmtMontant(plan.montant_paye)}</strong></div>
                <div class="col-4"><div class="small text-secondary">Reste</div><strong class="text-danger">${fmtMontant(plan.reste_du)}</strong></div>
              </div>
              <div class="table-responsive"><table class="table table-sm">
                <thead><tr><th>#</th><th>Échéance</th><th>Prévu</th><th>Versé</th><th>Statut</th><th></th></tr></thead>
                <tbody>${plan.tranches.map((t) => `
                  <tr>
                    <td>${t.numero_tranche}</td>
                    <td>${fmtDate(t.date_echeance)}</td>
                    <td>${fmtMontant(t.montant_prevu)}</td>
                    <td>${fmtMontant(t.montant_verse)}</td>
                    <td>${badgeStatut(t.statut)}</td>
                    <td><button class="btn btn-sm btn-vert" onclick="enregistrerVersement(${p.id}, ${t.id}, ${t.montant_prevu})">Versement</button></td>
                  </tr>`).join("")}</tbody></table></div>` :
              `<p class="text-secondary">Pas de plan de paiement.</p>
               <button class="btn btn-vert" onclick="creerPlan(${p.id})">+ Créer le plan de paiement</button>`}
          </div></div>
        </div>
      </div>`;
  } catch (err) { contenu.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
});

// --- Paiements (liste) ---
routeur.ajouter(/^\/paiements$/, async function () {
  const contenu = document.getElementById("contenu");
  contenu.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>`;
  try {
    const d = await API.get("dashboard/");
    const pelerins = await API.get("pelerins/");
    const payes = d.finance;
    contenu.innerHTML = `
      <h4 class="mb-3">Paiements</h4>
      <div class="row g-3 mb-3">
        <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
          <div class="text-secondary small">Attendu</div><div class="fs-5 fw-bold">${fmtMontant(payes.total_du)}</div></div></div></div>
        <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
          <div class="text-secondary small">Collecté</div><div class="fs-5 fw-bold text-success">${fmtMontant(payes.total_paye)}</div></div></div></div>
        <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
          <div class="text-secondary small">Reste à percevoir</div><div class="fs-5 fw-bold text-danger">${fmtMontant(payes.total_reste_du)}</div></div></div></div>
      </div>
      <h6>Relance rapide — pèlerins en retard ou à venir</h6>
      <div class="table-responsive"><table class="table table-hover bg-white shadow-sm rounded">
        <thead><tr><th>Pèlerin</th><th>Plan</th><th>Payé</th><th>Reste</th><th></th></tr></thead>
        <tbody id="corpsRelances"></tbody></table></div>`;
    const corpsRelances = document.getElementById("corpsRelances");
    for (const p of pelerins) {
      const detail = await API.get("pelerins/" + p.id + "/");
      const plan = detail.plan_paiement;
      if (!plan) continue;
      const enRetard = plan.tranches.some((t) => t.statut === "en_retard" || (t.statut === "a_venir" && new Date(t.date_echeance) < new Date()));
      corpsRelances.insertAdjacentHTML("beforeend", `
        <tr class="${enRetard ? "table-danger" : ""} page-lien" onclick="aller('/pelerins/${p.id}')">
          <td>${p.prenom} ${p.nom}</td>
          <td>${fmtMontant(plan.montant_total)}</td>
          <td>${fmtMontant(plan.montant_paye)}</td>
          <td>${fmtMontant(plan.reste_du)}</td>
          <td>${enRetard ? '<span class="badge bg-danger">En retard</span>' : '<span class="badge bg-secondary">À jour</span>'}</td>
        </tr>`);
    }
    if (!corpsRelances.children.length) corpsRelances.innerHTML = `<tr><td colspan="5" class="text-center text-secondary py-4">Aucun plan de paiement encore créé.</td></tr>`;
  } catch (err) { contenu.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
});

    afficherToast("Rappel marqué comme envoyé.");
    routeur.naviguer();
  } catch (err) { afficherToast(err.message, "danger"); }
};

window.modifierPelerin = async function (id) {
  const p = await API.get("pelerins/" + id + "/");

  ouvrirModal("Modifier le pèlerin", `
    <form id="formModifPelerin">
      ${champ("m_groupe", "select", "Groupe", { requis: true, choix: groupes.map((g) => [g.id, g.nom]), valeur: p.groupe })}
      <div class="row">
        <div class="col-md-6">${champ("m_nom", "text", "Nom", { requis: true, valeur: p.nom })}</div>
        <div class="col-md-6">${champ("m_prenom", "text", "Prénom", { requis: true, valeur: p.prenom })}</div>
      </div>
      ${champ("m_telephone", "text", "Téléphone", { requis: true, valeur: p.telephone })}
      ${champ("m_email", "email", "Email (optionnel)", { valeur: p.email || "" })}
      <div class="row">
        <div class="col-md-6">${champ("m_naissance", "date", "Date de naissance", { valeur: p.date_naissance || "" })}</div>
        <div class="col-md-6">${champ("m_sexe", "select", "Sexe", { choix: [["", "—"], ["M", "Homme"], ["F", "Femme"]], valeur: p.sexe || "" })}</div>
      </div>
      <div class="row">
        <div class="col-md-6">${champ("m_urg_nom", "text", "Contact urgence — nom", { valeur: p.contact_urgence_nom || "" })}</div>
        <div class="col-md-6">${champ("m_urg_tel", "text", "Contact urgence — téléphone", { valeur: p.contact_urgence_telephone || "" })}</div>
      </div>
      <div class="d-flex gap-2"><button class="btn btn-vert">Enregistrer</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button></div>
    </form>`);
  document.getElementById("formModifPelerin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const corps = {
      groupe: Number(document.getElementById("m_groupe").value),
      nom: document.getElementById("m_nom").value,
      prenom: document.getElementById("m_prenom").value,
      telephone: document.getElementById("m_telephone").value,
      email: document.getElementById("m_email").value || null,
      date_naissance: document.getElementById("m_naissance").value || null,
      sexe: document.getElementById("m_sexe").value || null,
      contact_urgence_nom: document.getElementById("m_urg_nom").value || null,
      contact_urgence_telephone: document.getElementById("m_urg_tel").value || null,
    };
    try {
      await API.patch("pelerins/" + id + "/", corps);
      fermerModal();
      afficherToast("Pèlerin mis à jour.");
      routeur.naviguer();
    } catch (err) { afficherToast(err.message, "danger"); }
  });
};

window.creerPlan = function (id) {
  ouvrirModal("Créer le plan de paiement", `
    <form id="formPlan">
      ${champ("pl_montant", "number", "Montant total (FCFA)", { requis: true, min: "1", step: "1" })}
      ${champ("pl_tranches", "number", "Nombre de tranches", { requis: true, min: "1", step: "1", valeur: "4" })}
      <div class="d-flex gap-2"><button class="btn btn-vert">Créer le plan</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button></div>
    </form>`);
  document.getElementById("formPlan").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await API.post("pelerins/" + id + "/plan/", {
        montant_total: Number(document.getElementById("pl_montant").value),
        nombre_tranches: Number(document.getElementById("pl_tranches").value),
      });
      fermerModal();
      afficherToast("Plan de paiement créé avec ses tranches.");
      routeur.naviguer();
    } catch (err) { afficherToast(err.message, "danger"); }
  });
};

window.enregistrerVersement = function (pelerinId, trancheId, prevu) {
  ouvrirModal("Enregistrer un versement", `
    <form id="formVersement">
      <div class="mb-3"><label class="form-label">Montant prévu de la tranche</label>
        <input class="form-control" value="${fmtMontant(prevu)}" disabled></div>
      ${champ("v_montant", "number", "Montant versé (FCFA)", { requis: true, min: "1", step: "1" })}
      ${champ("v_mode", "select", "Mode de paiement", { requis: true, choix: [["especes", "Espèces"], ["wave", "Wave"], ["orange_money", "Orange Money"], ["virement", "Virement bancaire"], ["autre", "Autre"]] })}
      ${champ("v_reference", "text", "Référence (optionnel)")}
      <div class="d-flex gap-2"><button class="btn btn-vert">Enregistrer</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button></div>
    </form>`);
  document.getElementById("formVersement").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await API.post("tranches/" + trancheId + "/versements/", {
        montant_paye: Number(document.getElementById("v_montant").value),
        mode: document.getElementById("v_mode").value,
        reference: document.getElementById("v_reference").value || null,
      });
      fermerModal();
      afficherToast("Versement enregistré.");
      routeur.naviguer();
    } catch (err) { afficherToast(err.message, "danger"); }
  });
};

window.modifierDocument = async function (id) {
  const doc = await API.get("documents/" + id + "/");
  ouvrirModal("Modifier le document", `
    <form id="formDoc">
      <div class="mb-3"><strong>${doc.type_document_label}</strong></div>
      ${champ("d_statut", "select", "Statut", { requis: true, choix: [["manquant", "Manquant"], ["soumis", "Soumis"], ["valide", "Validé"], ["rejete", "Rejeté"]], valeur: doc.statut })}
      ${champ("d_expiration", "date", "Date d'expiration", { valeur: doc.date_expiration || "" })}
      <div class="d-flex gap-2"><button class="btn btn-vert">Enregistrer</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button></div>
    </form>`);
  document.getElementById("formDoc").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await API.patch("documents/" + id + "/", {
        statut: document.getElementById("d_statut").value,
        date_expiration: document.getElementById("d_expiration").value || null,
      });
      fermerModal();
      afficherToast("Document mis à jour.");
      routeur.naviguer();
    } catch (err) { afficherToast(err.message, "danger"); }

};

// Démarrage
// ----------------------------------------------------------------
document.getElementById("boutonDeconnexion").addEventListener("click", async (e) => {
  e.preventDefault();
  try {
    await fetch(API.base + "deconnexion/", { method: "POST", credentials: "same-origin", headers: { "X-CSRFToken": API.csrf } });
  } catch (err) {}
  profil = null;
  aller("/connexion");
});

window.addEventListener("hashchange", () => routeur.naviguer());

(async function demarrer() {
  await API.initCSRF();
  const connecte = await verifierSession();
  if (!connecte) {
    aller("/connexion");
    return;
  }
  rendreNavigation();
  routeur.naviguer();
})();
